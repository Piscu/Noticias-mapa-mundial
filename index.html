<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0a0f1c" />
    <title>Noticias del Mundo · Mapa</title>

    <!-- Tema antes del primer pintado: evita el destello claro/oscuro -->
    <script>
      try {
        if (localStorage.getItem("tema") === "claro") {
          document.documentElement.dataset.tema = "claro";
        }
      } catch (e) {}
    </script>

    <!-- Tipografía editorial. Si no hay red, cae en la pila del sistema -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,500;6..72,600;6..72,700&display=swap"
    />

    <!-- Leaflet 1.9.4 servido desde este mismo servidor: sin CDN.
         Las rutas son relativas para que la página funcione igual en
         http://localhost:3000/ que en https://usuario.github.io/Noticias/ -->
    <link rel="stylesheet" href="vendor/leaflet/leaflet.css" />
    <link rel="stylesheet" href="estilos.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%97%A3%3C/text%3E%3C/svg%3E"
    />
  </head>
  <body>
    <div id="app">
      <header class="barra">
        <div class="marca">
          <span class="logo" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="9" />
              <path d="M3 12h18M12 3a15 15 0 0 1 0 18a15 15 0 0 1 0-18Z" />
            </svg>
          </span>
          <div class="marca-texto">
            <h1>Noticias del Mundo</h1>
            <p id="subtitulo">Cargando…</p>
          </div>
        </div>

        <div class="buscador">
          <svg class="buscador-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="11" cy="11" r="7" />
            <path d="m20 20-3.5-3.5" />
          </svg>
          <input id="q" type="search" placeholder="Buscar en titulares y resúmenes…" autocomplete="off" />
        </div>

        <div class="acciones">
          <select id="horas" aria-label="Rango temporal">
            <option value="0">Todo el histórico</option>
            <option value="1">Última hora</option>
            <option value="6">Últimas 6 h</option>
            <option value="12">Últimas 12 h</option>
            <option value="24" selected>Últimas 24 h</option>
            <option value="72">Últimos 3 días</option>
            <option value="168">Última semana</option>
          </select>

          <button id="btn-tema" class="icono" type="button" title="Alternar tema claro/oscuro" aria-label="Alternar tema claro/oscuro">
            <svg class="ico-tema ico-luna" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z" />
            </svg>
            <svg class="ico-tema ico-sol" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="4" />
              <path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4m11.4-11.4 1.4-1.4" />
            </svg>
          </button>

          <button id="btn-probar" class="icono" type="button" title="Probar la clasificación con un texto" aria-label="Probar la clasificación">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M9 3h6M10 3v6.5L5.2 17A2 2 0 0 0 7 20h10a2 2 0 0 0 1.8-3L14 9.5V3" />
              <path d="M7.5 15h9" />
            </svg>
          </button>

          <button id="btn-refrescar" class="primario" type="button" title="Volver a recopilar los titulares">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M21 12a9 9 0 1 1-2.6-6.4M21 3v6h-6" />
            </svg>
            <span>Actualizar</span>
          </button>
        </div>
      </header>

      <div class="cuerpo">
        <aside class="lateral">
          <section>
            <h2>Temáticas</h2>
            <div id="filtro-cats" class="chips"></div>
          </section>

          <section>
            <h2>Continente / País <span id="cont-lugares" class="muestreo"></span></h2>
            <div class="scroll" id="filtro-lugares"></div>
          </section>

          <section>
            <h2>Portales <span id="cont-fuentes" class="muestreo"></span></h2>
            <div class="scroll" id="filtro-fuentes"></div>
          </section>

          <section>
            <h2>Origen del marcador</h2>
            <div id="filtro-inferidas" class="chips"></div>
          </section>

          <section>
            <h2>Capa del mapa</h2>
            <div id="filtro-capas" class="chips"></div>
          </section>

          <section class="pie-lateral">
            <button id="btn-limpiar" class="ancho" type="button">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M3 6h18M8 6V4h8v2m-9 0 1 14h8l1-14" />
              </svg>
              Limpiar filtros
            </button>
            <p class="nota" id="estado-fuentes"></p>
          </section>
        </aside>

        <main id="mapa" aria-label="Mapa mundial de noticias"></main>
      </div>

      <section class="tira" aria-label="Últimas noticias">
        <header class="tira-cab">
          <h2 id="tira-titulo">Últimas noticias</h2>
          <div class="tira-nav">
            <span id="tira-info" class="muestreo"></span>
            <button id="btn-tira-menos" type="button" aria-label="Desplazar a la izquierda">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6" /></svg>
            </button>
            <button id="btn-tira-mas" type="button" aria-label="Desplazar a la derecha">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6" /></svg>
            </button>
          </div>
        </header>
        <div id="tira" class="tira-tarjetas"></div>
      </section>

      <dialog id="dlg-probar">
        <form method="dialog">
          <h3>Probar la clasificación</h3>
          <label>
            Titular
            <input id="p-titulo" type="text" placeholder="Escribe un titular de ejemplo…" />
          </label>
          <label>
            Resumen (opcional)
            <textarea id="p-desc" rows="3" placeholder="Texto del artículo…"></textarea>
          </label>
          <div class="acciones-probar">
            <button value="cancelar" class="neutro">Cerrar</button>
            <button id="p-ejecutar" value="ok" class="primario">Analizar</button>
          </div>
          <output id="p-resultado"></output>
        </form>
      </dialog>

      <div id="cargando" class="cargando oculto">
        <div class="spinner"></div>
        <span>Recopilando noticias de los portales…</span>
      </div>
    </div>

    <script src="vendor/leaflet/leaflet.js"></script>
    <script src="bundle.js"></script>
  </body>
</html>
